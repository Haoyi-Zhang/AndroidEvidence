name: Scientific bookkeeping checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-ledgers:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check owned ledgers and finite coverage model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scientific-output
          ulimit -v 2097152
          ulimit -t 240
          timeout --signal=TERM --kill-after=5s 260s \
            python -B scripts/reproduce.py --out scientific-output \
            > scientific-output/runner.stdout.txt 2> scientific-output/runner.stderr.txt
      - name: Retain raw outputs even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scientific-bookkeeping-output
          path: scientific-output/
          if-no-files-found: warn
          retention-days: 14
